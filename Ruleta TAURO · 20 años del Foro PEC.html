<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta TAURO · XX Foro Pensando en Colombia</title>
<style>
:root{--bg1:#fff7e6;--bg2:#ffe3d6;--ink:#2a1a1a;--card:#ffffffcc;--red:#b5303a;--muted:#6b5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a0f14;--bg2:#161226;--ink:#fff4e4;--card:#ffffff14;--muted:#d9c3c3;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a0f14;--bg2:#161226;--ink:#fff4e4;--card:#ffffff14;--muted:#d9c3c3;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Poppins","Segoe UI",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);text-align:center;padding:16px 12px 40px}
h1{margin:6px 0 0;font-size:clamp(46px,11vw,92px);font-weight:900;letter-spacing:2px;line-height:1;background:linear-gradient(115deg,#1aa0a0,#f5d000 25%,#e8352a 50%,#2d3fa8 75%,#1aa0a0);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #1a1a1a;paint-order:stroke fill}
.tag{margin:0;font-size:14px;color:var(--muted)}
.sub{margin:10px auto 0;max-width:560px;font-size:clamp(15px,3.6vw,19px);font-weight:600}
.sub b{color:var(--red)}
.col{font-weight:800}.col i{font-style:normal}
.stage{position:relative;width:min(92vw,560px);aspect-ratio:1;margin:18px auto 8px}
canvas#w{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 22px #0005)}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:44px solid #f5c518;filter:drop-shadow(0 3px 2px #0007);z-index:2}
.ptr::after{content:"";position:absolute;left:-9px;top:-38px;width:18px;height:18px;border-radius:50%;background:#b5303a;border:3px solid #fff}
button{font:inherit;cursor:pointer}
#go{margin:10px 0;padding:15px 44px;font-size:21px;font-weight:800;letter-spacing:1px;color:#fff;border:0;border-radius:999px;background:linear-gradient(135deg,#d6303f,#b5303a 60%,#8f1f2b);box-shadow:0 6px 0 #6d141e,0 12px 22px #0004;transition:transform .1s}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #6d141e}
#go:disabled{opacity:.55;cursor:default}
label{display:block;margin:8px 0;font-size:14px;color:var(--muted)}
.hist{max-width:560px;margin:18px auto 0;background:var(--card);border-radius:16px;padding:14px 18px;text-align:left;backdrop-filter:blur(4px)}
.hist h3{margin:0 0 8px;font-size:15px}
.hist ol{margin:0;padding-left:22px;font-size:15px}
.hist li{margin:3px 0}
.hist small{color:var(--muted)}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:10;padding:16px}
#ov.on{display:flex}
.modal{position:relative;z-index:2;background:#fffaf0;color:#2a1a1a;border-radius:24px;padding:28px 26px;max-width:460px;width:100%;border:6px solid #f5c518;box-shadow:0 0 0 6px #b5303a,0 20px 50px #000a;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.modal small{letter-spacing:3px;font-weight:700;color:#b5303a}
.modal h2{margin:8px 0 6px;font-size:clamp(28px,7vw,40px);line-height:1.1}
.modal p{margin:0 0 16px;font-size:15px}
.modal button{padding:11px 28px;border:0;border-radius:999px;background:#1f4e9e;color:#fff;font-weight:700;font-size:16px}
canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:11}
.logos{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);flex-wrap:wrap;margin-top:4px}.lg{display:block;height:auto;border-radius:18px}.lg.foro{width:min(46vw,300px);background:#fff;padding:6px;box-shadow:0 6px 18px #0003}.lg.tauro{width:min(40vw,230px);box-shadow:0 6px 18px #0004;border:3px solid #f5c518}
</style>
</head>

<script>
(function(){
var ALL=["Diana Padilla","Samuel Fernández","Javier Rosales","David Sierra","Juan Alejandro Rojas","Juan Miguel Mendoza","Santiago Arciniegas Núñez","Santiago Jaramillo","María José Cataño","Danna Fernández","Juan Diego Celis","Mariana Ortega","Sarah Sofía Herrera","Angelina Visbal González","Juan Manuel Pita","Francesca Zamora Alba","Daniel Jiménez Guarnizo","Andrés Felipe Ríos González","Natalia Hernández","Antonella Díaz","Mariana Araujo","María Paula Ceballos","Rebecca Páez","Isabel Sofía Bustillo","Antonella Bonett Camacho","Luca Libonati","Liam Bornhoft","Mariana Judex","Samuel Restrepo","Maria Camila Gomez","Hannah Janke","Martin Salazar","Juan Pablo Cuervo","Andrea Díaz","Daniel Manotas","Samuel Romero"];
var names=ALL.slice(),rot=0,busy=false,winners=[];
var cv=document.getElementById("w"),cx=cv.getContext("2d"),S=cv.width,C=S/2;
var COL=[["#c8283a","#fff"],["#f5c518","#2a1a1a"],["#1f4e9e","#fff"],["#fff1d6","#2a1a1a"]];
function rnd(){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
function fit(t,max){while(cx.measureText(t).width>max&&t.length>3)t=t.slice(0,-2).replace(/\s+$/,"");return t}
function draw(){
 var n=names.length,seg=2*Math.PI/Math.max(n,1),R=C-14;
 cx.clearRect(0,0,S,S);
 var g=cx.createRadialGradient(C,C,R*.8,C,C,C);g.addColorStop(0,"#f5c518");g.addColorStop(1,"#a8700a");
 cx.beginPath();cx.arc(C,C,C-2,0,7);cx.fillStyle=g;cx.fill();
 cx.beginPath();cx.arc(C,C,R+2,0,7);cx.fillStyle="#7a1620";cx.fill();
 for(var i=0;i<n;i++){
  var a0=rot+i*seg-Math.PI/2,a1=a0+seg,c=COL[i%4];
  cx.beginPath();cx.moveTo(C,C);cx.arc(C,C,R-6,a0,a1);cx.closePath();
  cx.fillStyle=c[0];cx.fill();cx.strokeStyle="#ffffffaa";cx.lineWidth=2;cx.stroke();
  cx.save();cx.translate(C,C);cx.rotate(a0+seg/2);cx.fillStyle=c[1];cx.textAlign="right";cx.textBaseline="middle";
  var fs=Math.max(15,Math.min(30,(R*seg)*.34));cx.font="700 "+fs+"px Poppins,Segoe UI,sans-serif";
  cx.fillText(fit(names[i],R-150),R-30,0);cx.restore();
 }
 for(var k=0;k<36;k++){var a=k*Math.PI/18,x=C+Math.cos(a)*(C-8),y=C+Math.sin(a)*(C-8);
  cx.beginPath();cx.arc(x,y,5.5,0,7);cx.fillStyle=k%2?"#fff":"#ffe27a";cx.fill();}
 var h=cx.createRadialGradient(C-14,C-14,6,C,C,70);h.addColorStop(0,"#fff");h.addColorStop(1,"#e8c874");
 cx.beginPath();cx.arc(C,C,66,0,7);cx.fillStyle=h;cx.fill();cx.lineWidth=8;cx.strokeStyle="#b5303a";cx.stroke();
 cx.fillStyle="#b5303a";cx.font="900 22px Poppins,Segoe UI,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillText("TAURO",C,C-6);
 cx.font="600 11px Poppins,Segoe UI,sans-serif";cx.fillStyle="#2a1a1a";cx.fillText("20 años",C,C+16);
}
function spin(){
 if(busy||!names.length)return;busy=true;document.getElementById("go").disabled=true;
 var n=names.length,seg=2*Math.PI/n,w=Math.floor(rnd()*n),j=(rnd()-.5)*.8;
 var tgt=-((w+.5+j)*seg),TP=2*Math.PI;
 var delta=(((tgt-rot)%TP)+TP)%TP+TP*(6+Math.floor(rnd()*3));
 var s=rot,t0=performance.now(),D=6500;
 function f(t){var p=Math.min((t-t0)/D,1),e=1-Math.pow(1-p,4);rot=s+delta*e;draw();
  if(p<1)requestAnimationFrame(f);else{rot=((rot%TP)+TP)%TP;done(w)}}
 requestAnimationFrame(f);
}
function done(w){
 var nm=names[w];winners.push(nm);
 document.getElementById("wn").textContent=nm;document.getElementById("ov").classList.add("on");boom();
 var li=document.createElement("li");li.textContent=nm;document.getElementById("hl").appendChild(li);document.getElementById("he").style.display="none";
 if(document.getElementById("rm").checked){names.splice(w,1);rot=0}
}
document.getElementById("ok").onclick=function(){
 document.getElementById("ov").classList.remove("on");busy=false;
 if(!names.length){names=ALL.slice();}
 draw();document.getElementById("go").disabled=false;
};
document.getElementById("go").onclick=spin;
var cf=document.getElementById("cf"),fx=cf.getContext("2d"),P=[];
function boom(){cf.width=innerWidth;cf.height=innerHeight;var cs=["#c8283a","#f5c518","#1f4e9e","#fff","#1aa0a0"];
 for(var i=0;i<160;i++)P.push({x:innerWidth/2,y:innerHeight/2.2,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+3,c:cs[i%5],a:Math.random()*6,l:130});
 (function L(){fx.clearRect(0,0,cf.width,cf.height);P=P.filter(function(p){return p.l>0});
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;p.l--;fx.save();fx.translate(p.x,p.y);fx.rotate(p.a);fx.fillStyle=p.c;fx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fx.restore()});
  if(P.length)requestAnimationFrame(L);else fx.clearRect(0,0,cf.width,cf.height)})();
}
draw();
})();
